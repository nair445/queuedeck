# Runtime settings live here, not in the image or the Deployment.
# Change a value, then:  kubectl apply -f k8s/configmap.yaml && kubectl rollout restart deployment/queuedeck
apiVersion: v1
kind: ConfigMap
metadata:
  name: queuedeck-config
  labels:
    app: queuedeck
data:
  APP_PORT: "8080"
  QUEUE_POLICY: "FIFO"
  QUEUE_CAPACITY: "50"
