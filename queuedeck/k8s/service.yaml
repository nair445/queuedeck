# One stable address in front of all QueueDeck pods.
# Reach it from your laptop with:  minikube service queuedeck --url
apiVersion: v1
kind: Service
metadata:
  name: queuedeck
  labels:
    app: queuedeck
spec:
  type: NodePort
  selector:
    app: queuedeck
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
